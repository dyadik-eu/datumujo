# Checks on every pull request and on every push to main.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The same version as go.mod, so CI checks what a developer builds.
          go-version-file: go.mod

      # go.mod must not list any module (requirement S-2).
      - name: standard library only
        run: |
          if grep -q '^require' go.mod; then
            echo "go.mod lists a module; S-2 allows the standard library only" >&2
            exit 1
          fi

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not formatted:" >&2
            echo "$out" >&2
            exit 1
          fi

      # The SQL tests compare with SQLite (P-4). The version goes in the
      # log, so a result can be traced to its oracle.
      - name: oracle
        run: sqlite3 --version

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # With the race detector: snapshots, the writer and checkpoints run
      # in goroutines at once (TestReadersAndWriterTogether).
      - name: test
        run: go test -race ./...

      # Every fuzz target runs for a time (requirement P-2). The script
      # fails when it finds no target: a step that checks nothing must not
      # pass. It runs a target again once after the deadline race of
      # go test -fuzz; see the script.
      - name: fuzz
        run: scripts/fuzz.sh 10

      - name: pre-push hook
        run: tests/pre-push.test.sh

      # The tests of scripts/fuzz.sh, then the same tests against a script
      # that always passes. That run must fail, or the tests prove nothing.
      - name: fuzz script
        run: |
          tests/fuzz.test.sh
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/pass.sh"
          chmod +x "$RUNNER_TEMP/pass.sh"
          if tests/fuzz.test.sh "$RUNNER_TEMP/pass.sh" > /dev/null; then
            echo "tests/fuzz.test.sh passes a script that checks nothing" >&2
            exit 1
          fi
