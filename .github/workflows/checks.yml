# Checks on every pull request and on every push to main.

name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The same version as go.mod, so CI checks what a developer builds.
          go-version-file: go.mod

      # go.mod must not list any module (requirement S-2).
      - name: standard library only
        run: |
          if grep -q '^require' go.mod; then
            echo "go.mod lists a module; S-2 allows the standard library only" >&2
            exit 1
          fi

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "not formatted:" >&2
            echo "$out" >&2
            exit 1
          fi

      # The SQL tests compare with SQLite (P-4). The version goes in the
      # log, so a result can be traced to its oracle.
      - name: oracle
        run: sqlite3 --version

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # With the race detector: snapshots, the writer and checkpoints run
      # in goroutines at once (TestReadersAndWriterTogether).
      - name: test
        run: go test -race ./...

      # Every fuzz target runs for a short time (requirement P-2). A run
      # that finds no target at all fails: a step that checks nothing must
      # not pass.
      - name: fuzz
        run: |
          count=0
          for pkg in $(go list ./...); do
            for target in $(go test -list '^Fuzz' "$pkg" | grep '^Fuzz' || true); do
              go test "$pkg" -run '^$' -fuzz "^${target}\$" -fuzztime 10s
              count=$((count + 1))
            done
          done
          echo "fuzz targets run: $count"
          [ "$count" -gt 0 ]

      - name: pre-push hook
        run: tests/pre-push.test.sh
